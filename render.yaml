# Render Blueprint for TrendWise (free web service).
# The backend also serves the built frontend, so one service runs the whole app.
services:
  - type: web
    name: trendwise
    env: python
    plan: free
    region: singapore
    rootDir: stock-engine
    buildCommand: pip install -r backend/requirements.txt && npm --prefix frontend install && npm --prefix frontend run build
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SCHEDULER
        value: "off"
      # Upstox Analytics Token (1-year, read-only). sync: false means the
      # value is set in the Render dashboard, never in this repo; until it
      # is set, the app falls back to Yahoo.
      - key: UPSTOX_ANALYTICS_TOKEN
        sync: false
